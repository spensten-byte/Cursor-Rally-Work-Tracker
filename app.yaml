command:
  - streamlit
  - run
  - app.py

# Other org-specific values (volume path, admin emails, box folder,
# branding, ...) are NOT set here — app.py resolves those via
# orgs/registry.py's apply_env_defaults() before any other module import.
# RALLY_ORG itself IS set explicitly below: databricks.yml's app resource
# `config.env` field does not reliably override/merge with this file in
# practice (each org now has its own physical app.yaml — see
# deploy/scpo/app.yaml — rather than relying on that bundle field).
env:
  - name: RALLY_ORG
    value: pase
  - name: DATABRICKS_MODEL_ENDPOINT
    value: "databricks-claude-sonnet-4-6"
  - name: CONTEXT_SUMMARY_COUNT
    value: "3"
  - name: MOCK_LLM
    value: "0"
  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"
  - name: PASE_TRACKER_PAT
    valueFrom: PASE_TRACKER_PAT
